<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ログイン - 点検日入力フォーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 2×2グリッドレイアウト（各セル960×540 = 16:9） */
        .login-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            height: 100vh;
            width: 100%;
            background: #e2e8f0;
            gap: 6px;
            padding: 6px;
            box-sizing: border-box;
        }
        .login-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .login-form-cell {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .ad-slot {
            background: #f8fafc;
            border: none;
            flex-direction: column;
            padding: 0;
        }
        .ad-slot-link {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }
        .ad-slot-image {
            flex: 1;
            overflow: hidden;
        }
        .ad-slot-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ad-slot-caption {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            background: white;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        .ad-slot-empty {
            color: #94a3b8;
            font-size: 0.875rem;
            text-align: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #64748b;
            font-size: 0.875rem;
        }
        .login-form .form-group {
            margin-bottom: 1.25rem;
        }
        .login-form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        .login-form input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-form input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }
        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.875rem;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-grid">
        <!-- 左上: ログインフォーム -->
        <div class="login-cell login-form-cell">
            <div class="login-card">
                <div class="login-header">
                    <h1>📋 点検日入力フォーム</h1>
                    <p>アカウントにログインしてください</p>
                    <span id="appVersion" class="version-badge" style="background: #e2e8f0; color: #64748b; margin-top: 0.5rem; display: inline-block;"></span>
                </div>

                <div class="error-message" id="errorMessage"></div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" required placeholder="example@company.com">
                    </div>
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input type="password" id="password" name="password" required placeholder="パスワードを入力">
                    </div>
                    <button type="submit" class="login-btn" id="loginButton">ログイン</button>
                </form>

                <div class="login-footer">
                    <p style="color: #64748b; font-size: 0.75rem;">
                        パスワードを忘れた場合は管理者にお問い合わせください
                    </p>
                </div>
            </div>
        </div>

        <!-- 広告枠1〜3 -->
        <div class="login-cell ad-slot" data-slot="1"><div class="ad-slot-empty">広告スペース</div></div>
        <div class="login-cell ad-slot" data-slot="2"><div class="ad-slot-empty">広告スペース</div></div>
        <div class="login-cell ad-slot" data-slot="3"><div class="ad-slot-empty">広告スペース</div></div>
    </div>

    <script src="js/version.js"></script>
    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.APP_VERSION) {
                document.getElementById('appVersion').textContent = window.APP_VERSION;
            }
        });
    </script>
    <script type="module">
        import { signIn, getUser, isAdmin, getAdSlots } from './js/supabase-client.js';

        // XSS対策
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 広告枠読み込み
        async function loadAdSlots() {
            try {
                const slots = await getAdSlots();
                slots.forEach(slot => {
                    const cell = document.querySelector(`[data-slot="${slot.slot_index}"]`);
                    if (!cell) return;
                    if (!slot.is_active || !slot.image_url) {
                        cell.innerHTML = '<div class="ad-slot-empty">広告スペース</div>';
                        return;
                    }
                    const hasLink = !!slot.link_url;
                    const openTag = hasLink
                        ? `<a href="${escapeHtml(slot.link_url)}" target="_blank" rel="noopener noreferrer" class="ad-slot-link">`
                        : `<div class="ad-slot-link">`;
                    const closeTag = hasLink ? `</a>` : `</div>`;
                    cell.innerHTML = `${openTag}
                        <div class="ad-slot-image"><img src="${escapeHtml(slot.image_url)}" alt=""></div>
                    ${closeTag}`;
                });
            } catch (e) {
                console.error('広告枠読み込みエラー:', e);
            }
        }
        loadAdSlots();

        // 既にログイン済みの場合はリダイレクト
        async function checkAuth() {
            const user = await getUser();
            if (user) {
                const admin = await isAdmin();
                window.location.href = admin ? 'admin.html' : 'index.html';
            }
        }
        checkAuth();

        // ログインフォーム処理
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const errorMessage = document.getElementById('errorMessage');

            button.disabled = true;
            button.textContent = 'ログイン中...';
            errorMessage.classList.remove('show');

            try {
                await signIn(email, password);
                const admin = await isAdmin();
                window.location.href = admin ? 'admin.html' : 'index.html';
            } catch (error) {
                errorMessage.textContent = 'ログインに失敗しました。メールアドレスとパスワードを確認してください。';
                errorMessage.classList.add('show');
                button.disabled = false;
                button.textContent = 'ログイン';
            }
        });
    </script>
</body>
</html>
